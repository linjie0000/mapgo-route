<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>旅游出行</title>
<style>
:root{--pri:#1677ff;--pri-l:#e6f0ff;--ok:#52c41a;--warn:#faad14;--err:#ff4d4f;--bg:#f5f5f5;--card:#fff;--txt:#1a1a1a;--txt2:#666;--bd:#e8e8e8;--sh:0 2px 12px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;height:100vh}

.hdr{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--card);box-shadow:0 1px 0 var(--bd);display:flex;align-items:center;padding:0 16px;height:56px;gap:8px}
.hdr .logo{font-size:20px;font-weight:800;color:var(--pri);white-space:nowrap;letter-spacing:-.5px}
.hdr .logo em{font-style:normal;font-size:12px;font-weight:400;color:var(--txt3);margin-left:6px;letter-spacing:0}
.hdr .rb{margin-left:auto;display:flex;gap:8px}
.hdr .rb button{padding:6px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s;font-weight:500}
.hdr .rb button:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}

.pnl{position:fixed;top:56px;left:0;width:380px;bottom:0;z-index:900;background:var(--card);box-shadow:1px 0 0 var(--bd);display:flex;flex-direction:column;transition:transform .3s}
.pnl.hide{transform:translateX(-100%)}
.pnl-tog{position:fixed;top:64px;left:380px;z-index:901;width:28px;height:48px;background:var(--card);border-radius:0 8px 8px 0;box-shadow:var(--sh);border:1px solid var(--bd);border-left:none;cursor:pointer;font-size:14px;color:var(--txt2);transition:left .3s}
.pnl.hide~.pnl-tog{left:0}
.tabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0;background:var(--card)}
.tab{flex:1;padding:12px;text-align:center;font-size:14px;cursor:pointer;color:var(--txt2);border-bottom:2px solid transparent;transition:all .2s;font-weight:500}
.tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.tab:hover:not(.on){color:var(--txt)}
.body{flex:1;overflow-y:auto;padding:16px}

.grp{margin-bottom:14px}
.grp label{display:block;font-size:12px;color:var(--txt2);margin-bottom:6px;font-weight:500}
.iwrap{display:flex;align-items:center;background:var(--bg);border-radius:var(--radius);border:1.5px solid var(--bd);transition:all .2s}
.iwrap:focus-within{border-color:var(--pri);background:#fff;box-shadow:0 0 0 3px rgba(79,110,247,.1)}
.iwrap .ic{padding:0 0 0 10px;color:var(--txt3);font-size:16px;flex-shrink:0}
.iwrap input{flex:1;border:none;outline:none;padding:11px 8px;font-size:14px;background:transparent;min-width:0}
.iwrap .xb{padding:4px 8px;cursor:pointer;color:var(--txt3);font-size:18px;display:none;flex-shrink:0;background:none;border:none;border-radius:6px}
.iwrap .xb:hover{color:var(--err);background:rgba(248,113,113,.1)}

.b{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:10px 20px;border-radius:var(--radius);border:none;font-size:14px;cursor:pointer;transition:all .2s;font-weight:600}
.bp{background:var(--pri);color:#fff}.bp:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,110,247,.25)}
.bo{background:transparent;border:1.5px solid var(--bd);color:var(--txt)}.bo:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bs{padding:5px 12px;font-size:12px}
.bk{width:100%}

.modes{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.mc{padding:7px 16px;border-radius:20px;border:1.5px solid var(--bd);font-size:13px;cursor:pointer;transition:all .2s;background:var(--card);user-select:none;font-weight:500}
.mc.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 2px 8px rgba(79,110,247,.25)}
.mc:hover:not(.on){transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.08)}

.pc{padding:12px;border-radius:var(--radius);border:1.5px solid var(--bd);margin-bottom:10px;cursor:pointer;transition:all .2s;background:var(--card)}
.pc:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.pc .pn{font-size:14px;font-weight:600;margin-bottom:2px}
.pc .pa{font-size:12px;color:var(--txt2)}
.pc .pd{font-size:12px;color:var(--pri);margin-top:4px;font-weight:500}
.pc .pab{margin-top:8px;display:flex;gap:8px}

.rs{background:linear-gradient(135deg,var(--pri-l),#f0f4ff);border-radius:var(--radius);padding:14px;margin-bottom:14px;border:1px solid rgba(79,110,247,.15)}
.rs .rt{font-size:26px;font-weight:800;color:var(--pri)}
.rs .rd{font-size:14px;color:var(--txt2);margin-top:2px}
.step{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.step:last-child{border-bottom:none}
.step .dot{width:8px;height:8px;border-radius:50%;background:var(--pri);margin-top:6px;flex-shrink:0}
.step .st{font-size:13px;color:var(--txt);line-height:1.5}
.step .sm{font-size:12px;color:var(--txt2)}



.collapse-hd{font-size:13px;color:var(--txt2);cursor:pointer;margin:10px 0;display:flex;align-items:center;gap:4px;user-select:none;font-weight:500;padding:8px 0;transition:color .2s}
.collapse-hd:hover{color:var(--pri)}
.collapse-bd{overflow:hidden;height:0;transition:height .25s ease-out}
.collapse-bd.show{height:auto;overflow:visible}

.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2000;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:12px;padding:20px;width:90%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{font-size:16px;margin-bottom:12px}
.modal textarea{width:100%;height:100px;border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:13px;resize:none}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#1F2937;color:#fff;padding:10px 24px;border-radius:24px;font-size:13px;z-index:3000;opacity:0;transition:all .3s;pointer-events:none;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#mapBox{position:fixed;top:56px;left:380px;right:0;bottom:0;transition:left .3s}
.loc-btn{position:fixed;right:16px;bottom:28px;z-index:800;width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:var(--sh-lg);border:1px solid var(--bd);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;transition:all .2s}
.loc-btn:hover{transform:scale(1.1);box-shadow:0 8px 28px rgba(0,0,0,.15)}

.empty{text-align:center;padding:40px 20px;color:var(--txt2)}
.pagi{display:flex;justify-content:center;gap:8px;margin-top:12px}
.pagi button{padding:4px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
.pagi button:disabled{opacity:.4;cursor:default}

.ac{position:fixed;z-index:1100;background:var(--card);border:1.5px solid var(--bd);border-radius:0 0 var(--radius) var(--radius);max-height:240px;overflow-y:auto;box-shadow:var(--sh-lg)}
.ac div{padding:10px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--bg);transition:background .15s}
.ac div:last-child{border-bottom:none}
.ac div:hover{background:var(--pri-l);transform:translateX(2px)}

.spin{display:inline-block;width:20px;height:20px;border:2px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.loc-btn-sm{padding:4px 8px;border:none;background:none;cursor:pointer;color:var(--txt3);font-size:16px;flex-shrink:0;transition:all .15s;border-radius:6px}
.loc-btn-sm:hover{color:var(--pri);background:var(--pri-l)}
.loc-btn-sm.spin-anim{animation:sp .8s linear infinite}

.wp-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.wp-row input{flex:1;padding:9px 10px;border:1.5px solid var(--bd);border-radius:var(--radius);font-size:13px;background:var(--bg);transition:all .2s}
.wp-row input:focus{border-color:var(--pri);background:#fff;outline:none}
.wp-row .del{cursor:pointer;color:var(--txt3);font-size:18px;background:none;border:none;padding:4px;border-radius:6px}
.wp-row .del:hover{color:var(--err);background:rgba(248,113,113,.1)}

.sel select{width:100%;padding:9px 10px;border-radius:var(--radius);border:1.5px solid var(--bd);font-size:13px;background:var(--bg);transition:all .2s}
.sel select:focus{border-color:var(--pri);outline:none}

@media(max-width:768px){
  .pnl{top:auto;left:0;right:0;bottom:0;width:100%;height:50vh;border-radius:20px 20px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.1)}
  .pnl.hide{transform:translateY(100%)}
  .pnl-tog{top:auto;bottom:52vh;left:50%;transform:translateX(-50%);width:48px;height:28px;border-radius:8px 8px 0 0}
  .pnl.hide~.pnl-tog{bottom:0}
  #mapBox{left:0;bottom:50vh;top:56px}
  .ac{width:calc(100vw - 32px)}
}
.body::-webkit-scrollbar{width:4px}
.body::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px}

/* 时间线样式 */
.tl-stats{display:flex;gap:8px;margin-bottom:12px}
.tl-stat{flex:1;background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.tl-stat .num{font-size:20px;font-weight:800}
.tl-stat .lab{font-size:10px;color:var(--txt2)}
.tl-chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tl-chip{padding:4px 10px;border-radius:14px;font-size:12px;font-weight:600;border:1px solid var(--bd);background:var(--card);cursor:pointer;transition:all .15s}
.tl-chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.tl-chip:hover:not(.on){border-color:var(--pri);color:var(--pri)}
.tl-form{margin-bottom:10px}
.tl-form label{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:4px}
.tl-form input,.tl-form textarea{width:100%;border:1px solid var(--bd);border-radius:8px;padding:9px 12px;font-size:14px;outline:none;transition:border-color .15s;font-family:inherit}
.tl-form input:focus,.tl-form textarea:focus{border-color:var(--pri)}
.tl-form textarea{resize:vertical;min-height:40px}
.tl-types{display:flex;gap:8px}
.tl-type{flex:1;padding:8px;border:2px solid var(--bd);border-radius:8px;text-align:center;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.tl-type.on[data-t=food]{border-color:var(--err);background:rgba(255,77,79,.08);color:var(--err)}
.tl-type.on[data-t=scenic]{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.tl-type.on[data-t=hotel]{border-color:var(--warn);background:rgba(250,173,20,.08);color:var(--warn)}
.tl-date-grp{margin-bottom:14px}
.tl-date-lbl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:8px;cursor:pointer;padding:0 2px}
.tl-date-lbl .arr{font-size:10px;transition:transform .2s}
.tl-date-lbl .arr.collapsed{transform:rotate(-90deg)}
.tl-card{background:var(--card);border-radius:10px;padding:12px;margin-bottom:6px;border-left:3px solid var(--pri);transition:all .15s}
.tl-card.type-food{border-left-color:var(--err)}
.tl-card.type-scenic{border-left-color:var(--pri)}
.tl-card.type-hotel{border-left-color:var(--warn)}
.tl-card.done{opacity:.6}
.tl-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.tl-type-badge{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600}
.tl-type-badge.food{background:rgba(255,77,79,.08);color:var(--err)}
.tl-type-badge.scenic{background:var(--pri-l);color:var(--pri)}
.tl-type-badge.hotel{background:rgba(250,173,20,.08);color:var(--warn)}
.tl-status{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:600;cursor:pointer;border:none}
.tl-status.pending{background:rgba(250,173,20,.08);color:var(--warn)}
.tl-status.completed{background:rgba(82,196,26,.08);color:var(--ok)}
.tl-card-name{font-size:14px;font-weight:600}
.tl-card-city{font-size:12px;color:var(--txt2)}
.tl-card-note{font-size:12px;color:var(--txt2);margin-top:4px;font-style:italic}
.tl-card-reason{font-size:11px;color:var(--err);margin-top:4px;font-style:italic;padding:4px 8px;background:rgba(255,77,79,.06);border-radius:4px}
.tl-card-time{font-size:11px;color:var(--txt2);margin-top:2px}
.tl-actions{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
.tl-act{font-size:11px;padding:3px 8px;border-radius:4px;border:1px solid var(--bd);background:var(--card);cursor:pointer;color:var(--txt);transition:all .15s}
.tl-act:hover{border-color:var(--pri);color:var(--pri)}
.tl-act.del{color:var(--err);border-color:rgba(255,77,79,.3)}
.tl-act.del:hover{background:rgba(255,77,79,.06)}
.tl-act.done-act{color:var(--ok);border-color:rgba(82,196,26,.3)}
.tl-act.done-act:hover{background:rgba(82,196,26,.06)}
.tl-prog-bar{background:var(--bg);border-radius:8px;padding:8px 10px 4px;margin-bottom:6px;overflow:hidden}
.tl-prog-track{position:relative;height:22px;background:var(--card);border-radius:4px;overflow:visible}
.tl-prog-ticks{display:flex;justify-content:space-between;padding:2px 0 0;font-size:9px;color:var(--txt3);font-weight:500;position:relative}
.tl-prog-tick{display:flex;flex-direction:column;align-items:center;width:0}
.tl-prog-tick::before{content:'';width:1px;height:4px;background:var(--bd);margin-bottom:1px}
.tl-prog-block{position:absolute;top:0;height:100%;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;transition:opacity .2s}
.tl-prog-block.food{background:rgba(255,77,79,.15);color:var(--err)}
.tl-prog-block.scenic{background:rgba(22,119,255,.15);color:var(--pri)}
.tl-prog-block.hotel{background:rgba(250,173,20,.15);color:var(--warn)}
.tl-prog-block.is-done{opacity:1}
.tl-prog-block.not-done{opacity:.35}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">旅游出行</div>
  <div class="rb">
    <button onclick="openShare()">分享</button>
  </div>
</div>

<div class="pnl" id="pnl">
  <div class="tabs">
    <div class="tab on" data-t="route" onclick="switchTab('route')">路线</div>
    <div class="tab" data-t="search" onclick="switchTab('search')">搜索</div>
    <div class="tab" data-t="hot" onclick="switchTab('hot')">热榜</div>
    <div class="tab" data-t="tl" onclick="switchTab('tl')">时间线</div>
  </div>

  <div class="body" id="pRoute">
    <div class="modes">
      <div class="mc on" data-m="driving" onclick="setMode('driving')">驾车</div>
      <div class="mc" data-m="transit" onclick="setMode('transit')">公交</div>
      <div class="mc" data-m="walking" onclick="setMode('walking')">步行</div>
      <div class="mc" data-m="riding" onclick="setMode('riding')">骑行</div>
    </div>
    <div class="grp"><label>位置 / 城市</label><div class="iwrap"><span class="ic">📍</span><input id="cityIpt" placeholder="定位中..." oninput="onAC('city')"><button class="loc-btn-sm" id="cityLocBtn" onclick="locateMe()" title="重新定位">📡</button><button class="xb" onclick="clr('city')">×</button></div></div>
    <div class="grp"><label>起点</label>
      <div class="iwrap"><span class="ic">📍</span><input id="fromIpt" placeholder="输入起点（留空则用当前位置）" oninput="onAC('from')"><button class="xb" onclick="clr('from')">×</button></div>
    </div>
    <div class="grp"><label>终点</label>
      <div class="iwrap"><span class="ic">🎯</span><input id="toIpt" placeholder="输入终点" oninput="onAC('to')"><button class="xb" onclick="clr('to')">×</button></div>
    </div>
    <div id="wpSec" style="display:none">
      <div class="collapse-hd" onclick="toggleC('wp')">▶ 途经点（可选）</div>
      <div class="collapse-bd" id="wp"><div id="wpList"></div><button class="b bo bs" onclick="addWP()">+ 添加途经点</button></div>
    </div>
    <div id="citySec" style="display:none"></div>
    <div>
      <div class="collapse-hd" onclick="toggleC('adv')">▶ 高级选项</div>
      <div class="collapse-bd sel" id="adv">
        <div id="dPolicy"><select id="dPolSel"><option value="0">最快</option><option value="1">最短</option><option value="2">少收费</option><option value="3">不走高速</option><option value="4">躲避拥堵</option></select></div>
        <div id="tPolicy" style="display:none"><select id="tPolSel"><option value="0">最快</option><option value="1">最少花费</option><option value="2">少步行</option><option value="3">最舒适</option><option value="4">不乘地铁</option></select></div>
      </div>
    </div>
    <button class="b bp bk" style="margin-top:12px" onclick="doRoute()">开始规划</button>
    <div id="routeRes" style="margin-top:12px"></div>
  </div>

  <div class="body" id="pSearch" style="display:none">
    <div class="grp"><label>搜索关键词</label>
      <div class="iwrap"><span class="ic">🔍</span><input id="kwIpt" placeholder="如：星巴克、停车场、景点" oninput="onAC('kw')"><button class="xb" onclick="clr('kw')">×</button></div>
    </div>
    <div class="grp"><label>当前位置</label>
      <div class="iwrap"><span class="ic">📍</span><input id="sCityIpt" placeholder="定位中..." oninput="onAC('sCity')"><button class="loc-btn-sm" id="sCityLocBtn" onclick="locateMe()" title="重新定位">📡</button><button class="xb" onclick="clr('sCity')">×</button></div>
    </div>
    <div>
      <div class="collapse-hd" onclick="toggleC('nearby')">▶ 周边搜索（可选）</div>
      <div class="collapse-bd" id="nearby">
        <div style="display:flex;gap:8px"><div style="flex:1"><label style="font-size:12px;color:var(--txt2)">经度</label><input type="number" id="sLng" placeholder="116.397" step="0.001" style="width:100%;padding:9px 10px;border:1.5px solid var(--bd);border-radius:var(--radius);font-size:13px;background:var(--bg)"></div><div style="flex:1"><label style="font-size:12px;color:var(--txt2)">纬度</label><input type="number" id="sLat" placeholder="39.909" step="0.001" style="width:100%;padding:9px 10px;border:1.5px solid var(--bd);border-radius:var(--radius);font-size:13px;background:var(--bg)"></div></div>
        <div style="margin-top:8px"><label style="font-size:12px;color:var(--txt2)">搜索半径（米）</label><input type="number" id="sRad" placeholder="3000" value="3000" style="width:100%;padding:9px 10px;border:1.5px solid var(--bd);border-radius:var(--radius);font-size:13px;background:var(--bg)"></div>
      </div>
    </div>
    <button class="b bp bk" style="margin-top:12px" onclick="doSearch()">搜索</button>
    <div id="searchRes" style="margin-top:12px"></div>
  </div>

  <!-- 热榜面板 -->
  <div class="body" id="pHot" style="display:none">
    <div class="grp"><label>搜索城市或地点</label>
      <div class="iwrap"><span class="ic">🔥</span><input id="hotIpt" placeholder="如：成都、杭州景点、三亚酒店" onkeydown="if(event.key==='Enter')doHotSearch()"><button class="xb" onclick="document.getElementById('hotIpt').value='';initHotTags()">×</button></div>
    </div>
    <div id="hotTags" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"></div>
    <div id="hotRes"></div>
  </div>

  <!-- 时间线面板 -->
  <div class="body" id="pTl" style="display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <div style="font-size:16px;font-weight:700">我的旅行时间线</div>
      <div style="display:flex;gap:6px">
        <button class="b bo bs" onclick="exportTl()">导出</button>
        <button class="b bp bs" onclick="showTlAdd()">+ 添加</button>
      </div>
    </div>
    <div id="tlStats" class="tl-stats" style="display:none"></div>
    <div id="tlFilter" class="tl-chips" style="display:none"></div>
    <div id="tlContent"><div class="empty"><div style="font-size:40px;margin-bottom:8px">📅</div><p>还没有旅行打卡计划</p><p style="font-size:12px;margin-top:4px">热榜搜索后添加，或手动创建</p></div></div>
  </div>

</div>

<div id="mapBox"></div>

<script src="https://webapi.amap.com/loader.js"></script>
<script>
var KEY='d32b4be5e03b0b30b6fe6909be6d84f6',SKEY='';
var A=null,map=null,ready=false,mode='driving',curStyle='normal',poiMks=[],acTmr=null;
var myPos=null; // 当前位置坐标

// ==================== 加载 ====================
window.onload=function(){
  document.getElementById('mapBox').innerHTML='<div class="empty" style="padding-top:80px"><div class="spin" style="margin:0 auto 12px"></div><p>地图加载中...</p></div>';
  window._AMapSecurityConfig={securityJsCode:SKEY||''};
  AMapLoader.load({key:KEY,version:'2.0',plugins:['AMap.Geocoder','AMap.Driving','AMap.Walking','AMap.Riding','AMap.Transfer','AMap.PlaceSearch','AMap.AutoComplete','AMap.Geolocation']}).then(function(AMap){
    A=AMap;window.AMap=AMap;window.A=A;
    map=new A.Map('mapBox',{zoom:12,center:[113.26,23.13],mapStyle:'amap://styles/normal',viewMode:'3D'});
    map.on('click',function(e){toast('位置: '+e.lnglat.getLng().toFixed(6)+', '+e.lnglat.getLat().toFixed(6))});
    ready=true;toast('地图加载成功');restoreURL();locateMe();
  }).catch(function(e){
    console.error('加载失败:',e);
    document.getElementById('mapBox').innerHTML='<div class="empty" style="padding-top:60px"><div style="font-size:48px;color:var(--err)">✗</div><p style="margin-top:12px">地图加载失败</p><p style="margin-top:8px;font-size:12px;color:var(--txt2)">请在 lbs.amap.com 确认：<br>1. Key 类型为「Web端(JS API)」<br>2. 域名白名单留空或添加 *<br>3. 新Key需配置安全密钥</p></div>';
  });
};

// 提取城市名（去掉区/县/镇/街道，只保留城市级别）
function extractCity(city){
  if(!city)return '';
  // 去掉"市"后面的部分：广州市越秀区 → 广州
  var m=city.match(/^(.+?)(?:市|自治州|地区|盟)/);
  if(m)return m[1];
  // 如果本身不含"市"，直接返回（如"广州"）
  return city.replace(/[市区县镇街道].*$/,'');
}

// ==================== Geocoder 地理编码（地名→坐标）====================
// 使用高德 REST API 替代 JSAPI 插件
function geocode(address,city){
  return new Promise(function(resolve,reject){
    if(!address){resolve(null);return}
    // 如果已经是坐标格式 "lng,lat"，直接返回
    var parts=address.split(',');
    if(parts.length===2&&!isNaN(parseFloat(parts[0]))&&!isNaN(parseFloat(parts[1]))){
      resolve(new A.LngLat(parseFloat(parts[0]),parseFloat(parts[1])));
      return;
    }
    doGeocode(address,city||'',resolve,reject);
  });
}
function doGeocode(address,city,resolve,reject){
  // 提取城市名（去掉区/县/街道，只保留城市级别）
  var cityParam=extractCity(city);
  var url='https://restapi.amap.com/v3/geocode/geo?address='+encodeURIComponent(address)+'&key='+KEY;
  if(cityParam)url+='&city='+encodeURIComponent(cityParam);
  fetch(url).then(function(r){return r.json()}).then(function(data){
    if(data.status==='1'&&data.geocodes&&data.geocodes.length>0){
      var loc=data.geocodes[0].location; // "lng,lat"
      var lngLat=loc.split(',');
      resolve(new A.LngLat(parseFloat(lngLat[0]),parseFloat(lngLat[1])));
    }else{
      searchPOI(address,city,resolve,reject);
    }
  }).catch(function(e){
    tryJSAPIGeocoder(address,resolve,reject);
  });
}
// 降级方案1：REST API POI 搜索
function searchPOI(address,city,resolve,reject){
  var cityParam=extractCity(city);
  var url='https://restapi.amap.com/v3/place/text?keywords='+encodeURIComponent(address)+'&key='+KEY+'&offset=3';
  if(cityParam)url+='&city='+encodeURIComponent(cityParam);
  fetch(url).then(function(r){return r.json()})
    .then(function(data){
      if(data.status==='1'&&data.pois&&data.pois.length>0){
        var loc=data.pois[0].location.split(',');
        resolve(new A.LngLat(parseFloat(loc[0]),parseFloat(loc[1])));
      }else{
        // POI 也找不到，最后尝试 JSAPI Geocoder
        tryJSAPIGeocoder(address,resolve,reject);
      }
    })
    .catch(function(e){
      tryJSAPIGeocoder(address,resolve,reject);
    });
}
// 降级方案2：JSAPI Geocoder 插件（带超时）
function tryJSAPIGeocoder(address,resolve,reject){
  try{
    var geo=new A.Geocoder({city:'全国'});
    var timer=setTimeout(function(){
      reject(new Error('地址解析超时: '+address));
    },5000);
    geo.getLocation(address,function(status,result){
      clearTimeout(timer);
      if(status==='complete'&&result.geocodes&&result.geocodes.length>0){
        var loc=result.geocodes[0].location;
        resolve(new A.LngLat(loc.lng,loc.lat));
      }else{
        reject(new Error('无法解析地址: '+address));
      }
    });
  }catch(e){
    reject(new Error('地址解析失败: '+address));
  }
}

  document.querySelectorAll('.mc').forEach(function(e){e.classList.remove('on')});

// 折叠 — 用 height:auto 方案，彻底解决 display:none 子元素不计算高度的问题
function toggleC(id){
  var bd=document.getElementById(id);if(!bd)return;
  var hd=bd.previousElementSibling;
  if(bd.classList.contains('show')){
    bd.classList.remove('show');bd.style.height='0';
    if(hd)hd.textContent=hd.textContent.replace('▼','▶');
  }else{
    bd.classList.add('show');bd.style.height='auto';
    if(hd)hd.textContent=hd.textContent.replace('▶','▼');
  }
}

// 途经点
function addWP(){var l=document.getElementById('wpList'),i=l.children.length;if(i>=16){toast('最多16个途经点');return}var d=document.createElement('div');d.className='wp-row';d.innerHTML='<input type="text" placeholder="途经点'+(i+1)+'"><button class="del" onclick="this.parentElement.remove()">×</button>';l.appendChild(d)}

// ==================== 路线规划（改用 REST API，避免 JSAPI 域名白名单限制）====================
var routeLine=null; // 当前路线折线
var routeMks=[];    // 起终点标记

function doRoute(){
  if(!ready){toast('地图尚未加载');return}
  var fromStr=document.getElementById('fromIpt').value.trim();
  var toStr=document.getElementById('toIpt').value.trim();
  if(!toStr){toast('请输入终点');return}
  var city=document.getElementById('cityIpt').value.trim();
  document.getElementById('routeRes').innerHTML='<div style="text-align:center;padding:12px"><div class="spin" style="margin:0 auto 8px"></div><div style="font-size:13px;color:var(--txt2)">路线规划中...</div></div>';

  // 先把起点/终点/途经点全部 geocode
  var tasks=[];
  var fromPos=null,toPos=null,wpPositions=[];

  if(fromStr){
    tasks.push(geocode(fromStr,city).then(function(p){fromPos=p}));
  }
  tasks.push(geocode(toStr,city).then(function(p){toPos=p}));
  var wpEls=document.querySelectorAll('.wp-row input');
  wpEls.forEach(function(el){
    var v=el.value.trim();
    if(v) tasks.push(geocode(v,city).then(function(p){wpPositions.push(p)}));
  });

  Promise.all(tasks).then(function(){
    if(!toPos){toast('无法解析终点地址');document.getElementById('routeRes').innerHTML='';return}
    var fromLngLat=fromPos?fromPos.lng+','+fromPos.lat:'';
    var toLngLat=toPos.lng+','+toPos.lat;
    var wpStr=wpPositions.map(function(p){return p.lng+','+p.lat}).join(';');
    try{
      if(mode==='driving') rDrivRest(fromLngLat,toLngLat,wpStr);
      else if(mode==='walking') rWalkRest(fromLngLat,toLngLat);
      else if(mode==='riding') rRideRest(fromLngLat,toLngLat);
      else if(mode==='transit') rTransRest(fromLngLat,toLngLat);
    }catch(e){console.error(e);document.getElementById('routeRes').innerHTML='';toast('规划出错: '+e.message)}
  }).catch(function(e){
    console.error(e);document.getElementById('routeRes').innerHTML='';toast('地址解析失败: '+e.message);
  });
}

// 驾车 - REST API
function rDrivRest(from,to,wp){
  var pol=parseInt(document.getElementById('dPolSel').value);
  var url='https://restapi.amap.com/v3/direction/driving?origin='+from+'&destination='+to+'&key='+KEY+'&strategy='+pol+'&extensions=all';
  if(wp) url+='&waypoints='+wp;
  fetch(url).then(function(r){return r.json()}).then(function(data){
    if(data.status==='1'&&data.route&&data.route.paths&&data.route.paths.length>0){
      renderDrivingRest(data.route);
    }else{
      document.getElementById('routeRes').innerHTML='';toast('路线规划失败: '+(data.info||''));
    }
  }).catch(function(e){document.getElementById('routeRes').innerHTML='';toast('网络错误: '+e.message)});
}

// 步行 - REST API
function rWalkRest(from,to){
  var url='https://restapi.amap.com/v3/direction/walking?origin='+from+'&destination='+to+'&key='+KEY;
  fetch(url).then(function(r){return r.json()}).then(function(data){
    if(data.status==='1'&&data.route&&data.route.paths&&data.route.paths.length>0){
      renderWalkingRest(data.route);
    }else{
      document.getElementById('routeRes').innerHTML='';toast('路线规划失败: '+(data.info||''));
    }
  }).catch(function(e){document.getElementById('routeRes').innerHTML='';toast('网络错误: '+e.message)});
}

// 骑行 - REST API
function rRideRest(from,to){
  var url='https://restapi.amap.com/v4/direction/bicycling?origin='+from+'&destination='+to+'&key='+KEY;
  fetch(url).then(function(r){return r.json()}).then(function(data){
    if(data.status==='1'&&data.data&&data.data.paths&&data.data.paths.length>0){
      renderRidingRest(data.data);
    }else{
      document.getElementById('routeRes').innerHTML='';toast('路线规划失败');
    }
  }).catch(function(e){document.getElementById('routeRes').innerHTML='';toast('网络错误: '+e.message)});
}

// 公交 - REST API
function rTransRest(from,to){
  var cityRaw=document.getElementById('cityIpt').value.trim();
  var city=extractCity(cityRaw);
  if(!cityRaw){toast('请输入位置或城市');document.getElementById('routeRes').innerHTML='';return}
  var pol=parseInt(document.getElementById('tPolSel').value);
  var url='https://restapi.amap.com/v3/direction/transit/integrated?origin='+from+'&destination='+to+'&city='+encodeURIComponent(city||cityRaw)+'&key='+KEY+'&strategy='+pol+'&extensions=all';
  fetch(url).then(function(r){return r.json()}).then(function(data){
    if(data.status==='1'&&data.route&&data.route.transits&&data.route.transits.length>0){
      renderTransitRest(data.route);
    }else{
      document.getElementById('routeRes').innerHTML='';toast('路线规划失败: '+(data.info||'无结果'));
    }
  }).catch(function(e){document.getElementById('routeRes').innerHTML='';toast('网络错误: '+e.message)});
}

// ==================== 渲染路线结果（REST API 数据格式）====================
function clearRouteLine(){
  if(routeLine){routeLine.setMap(null);routeLine=null}
  routeMks.forEach(function(m){m.setMap(null)});routeMks=[];
}

function drawPolyline(path){
  clearRouteLine();
  var line=new A.Polyline({path:path,strokeColor:'#4A90D9',strokeWeight:6,strokeOpacity:0.8,lineJoin:'round'});
  line.setMap(map);
  routeLine=line;
  map.setBounds(line.getBounds(),false,[60,60,60,60]);
}

function addRouteMarker(pos,color,label){
  var mk=new A.Marker({position:pos,offset:new A.Pixel(-12,-28),content:'<div style="background:'+color+';color:#fff;padding:2px 8px;border-radius:12px;font-size:12px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)">'+label+'</div>'});
  mk.setMap(map);routeMks.push(mk);
}

function renderDrivingRest(route){
  var path=route.paths[0],dist=parseInt(path.distance),time=parseInt(path.duration);
  var steps=[];
  if(path.steps) path.steps.forEach(function(s){
    steps.push({ins:s.instruction,d:parseInt(s.distance),t:parseInt(s.duration||0)});
  });
  // 收集所有 polyline 点
  var allPts=[];
  if(path.steps) path.steps.forEach(function(s){
    if(s.polyline) allPts=allPts.concat(decodePolyline(s.polyline));
  });
  if(allPts.length>0) drawPolyline(allPts);
  // 起终点标记
  if(allPts.length>0){
    addRouteMarker(allPts[0],'#4CAF50','起');
    addRouteMarker(allPts[allPts.length-1],'#F44336','终');
  }
  renderRouteUI('driving',dist,time,steps);
}

function renderWalkingRest(route){
  var path=route.paths[0],dist=parseInt(path.distance),time=parseInt(path.duration);
  var steps=[];
  if(path.steps) path.steps.forEach(function(s){
    steps.push({ins:s.instruction,d:parseInt(s.distance),t:parseInt(s.duration||0)});
  });
  var allPts=[];
  if(path.steps) path.steps.forEach(function(s){
    if(s.polyline) allPts=allPts.concat(decodePolyline(s.polyline));
  });
  if(allPts.length>0) drawPolyline(allPts);
  if(allPts.length>0){
    addRouteMarker(allPts[0],'#4CAF50','起');
    addRouteMarker(allPts[allPts.length-1],'#F44336','终');
  }
  renderRouteUI('walking',dist,time,steps);
}

function renderRidingRest(data){
  var path=data.paths[0],dist=parseInt(path.distance),time=parseInt(path.duration);
  var steps=[];
  if(path.steps) path.steps.forEach(function(s){
    steps.push({ins:s.instruction,d:parseInt(s.distance),t:0});
  });
  var allPts=[];
  if(path.steps) path.steps.forEach(function(s){
    if(s.polyline) allPts=allPts.concat(decodePolyline(s.polyline));
  });
  if(allPts.length>0) drawPolyline(allPts);
  if(allPts.length>0){
    addRouteMarker(allPts[0],'#4CAF50','起');
    addRouteMarker(allPts[allPts.length-1],'#F44336','终');
  }
  renderRouteUI('riding',dist,time,steps);
}

function renderTransitRest(route){
  var plan=route.transits[0],dist=parseInt(route.distance||0),time=parseInt(route.duration||0);
  var steps=[];
  var allPts=[];
  if(plan.segments) plan.segments.forEach(function(seg){
    var ins='';
    if(seg.walking&&seg.walking.steps){
      seg.walking.steps.forEach(function(s){
        ins+=s.instruction+' ';
        if(s.polyline) allPts=allPts.concat(decodePolyline(s.polyline));
      });
    }
    if(seg.bus&&seg.bus.buslines&&seg.bus.buslines.length>0){
      ins='乘坐 '+seg.bus.buslines[0].name;
      if(seg.bus.buslines[0].polyline) allPts=allPts.concat(decodePolyline(seg.bus.buslines[0].polyline));
    }
    if(ins) steps.push({ins:ins,d:parseInt(seg.distance||0),t:parseInt(seg.duration||0)});
  });
  if(allPts.length>0) drawPolyline(allPts);
  if(allPts.length>0){
    addRouteMarker(allPts[0],'#4CAF50','起');
    addRouteMarker(allPts[allPts.length-1],'#F44336','终');
  }
  renderRouteUI('transit',dist,time,steps);
}

function renderRouteUI(type,dist,time,steps){
  var mn={driving:'驾车',walking:'步行',riding:'骑行',transit:'公交'};
  var ds=dist>=1000?(dist/1000).toFixed(1)+' 公里':dist+' 米';
  var ts=time>=3600?Math.floor(time/3600)+' 时 '+Math.floor((time%3600)/60)+' 分':Math.ceil(time/60)+' 分钟';
  var c=document.getElementById('routeRes');
  var h='<div class="rs"><div style="font-size:12px;color:var(--txt2)">'+mn[type]+'路线</div><div class="rt">'+ts+'</div><div class="rd">总距离 '+ds+'</div></div>';
  if(steps.length){h+='<div style="font-size:13px;font-weight:600;margin-bottom:8px">路线详情</div>';steps.forEach(function(s,i){
    var m=[];if(s.d>0)m.push(s.d>=1000?(s.d/1000).toFixed(1)+'km':s.d+'m');if(s.t>0)m.push(Math.ceil(s.t/60)+'min');
    h+='<div class="step"><div class="dot"></div><div><div class="st">'+(i+1)+'. '+s.ins+'</div>';if(m.length)h+='<div class="sm">'+m.join(' · ')+'</div>';h+='</div></div>';
  })}
  c.innerHTML=h;toast('路线规划完成');
}

// 解码高德 REST API 返回的编码折线（每个坐标用分号分隔，经纬度用逗号分隔）
function decodePolyline(polyline){
  if(!polyline) return [];
  var pts=[];
  // REST API 返回格式："lng1,lat1;lng2,lat2;..."
  var pairs=polyline.split(';');
  pairs.forEach(function(pair){
    var parts=pair.split(',');
    if(parts.length===2){
      var lng=parseFloat(parts[0]),lat=parseFloat(parts[1]);
      if(!isNaN(lng)&&!isNaN(lat)) pts.push([lng,lat]);
    }
  });

}

// ==================== POI 搜索（改用 REST API）====================
function doSearch(){
  if(!ready){toast('地图尚未加载');return}
  var kw=document.getElementById('kwIpt').value.trim();if(!kw){toast('请输入关键词');return}
  clrPOI();
  document.getElementById('searchRes').innerHTML='<div style="text-align:center;padding:12px"><div class="spin" style="margin:0 auto 8px"></div><div style="font-size:13px;color:var(--txt2)">搜索中...</div></div>';
  var city=document.getElementById('sCityIpt').value.trim();
  var cityParam=extractCity(city);
  var lng=document.getElementById('sLng').value,lat=document.getElementById('sLat').value,rad=parseInt(document.getElementById('sRad').value)||3000;
  var url;
  // 优先使用周边搜索：有手动坐标 或 已定位(自动填充坐标)
  if(lng&&lat){
    url='https://restapi.amap.com/v3/place/around?key='+KEY+'&location='+lng+','+lat+'&radius='+rad+'&keywords='+encodeURIComponent(kw)+'&offset=10&extensions=all';
    if(cityParam)url+='&city='+encodeURIComponent(cityParam);
  }else if(myPos){
    // 已定位但没手动填坐标，自动用当前位置做周边搜索
    url='https://restapi.amap.com/v3/place/around?key='+KEY+'&location='+myPos[0]+','+myPos[1]+'&radius='+rad+'&keywords='+encodeURIComponent(kw)+'&offset=10&extensions=all';
    if(cityParam)url+='&city='+encodeURIComponent(cityParam);
  }else{
    url='https://restapi.amap.com/v3/place/text?key='+KEY+'&keywords='+encodeURIComponent(kw)+'&city='+encodeURIComponent(cityParam||city||'')+'&offset=10&extensions=all';
  }
  fetch(url).then(function(r){return r.json()}).then(function(data){
    if(data.status==='1'&&data.pois&&data.pois.length>0){
      renderPOIRest(data.pois,data.count);
    }else{
      document.getElementById('searchRes').innerHTML='';
      toast('搜索失败: '+(data.info||'无结果'));
    }
  }).catch(function(e){document.getElementById('searchRes').innerHTML='';toast('搜索错误: '+e.message)});
}

function renderPOIRest(pois,total){
  var c=document.getElementById('searchRes');
  var h='<div style="font-size:13px;color:var(--txt2);margin-bottom:8px">找到 '+total+' 个结果</div>';
  pois.forEach(function(p){
    var d=p.distance?(parseInt(p.distance)>=1000?(parseInt(p.distance)/1000).toFixed(1)+'km':p.distance+'m'):'';
    var loc=p.location?p.location.split(','):[0,0];
    h+='<div class="pc" onclick="panTo('+loc[0]+','+loc[1]+')"><div class="pn">'+p.name+'</div><div class="pa">'+(p.address||'')+'</div>';
    if(d)h+='<div class="pd">距离 '+d+'</div>';
    h+='<div class="pab"><button class="b bo bs" onclick="event.stopPropagation();setFrom(\''+esc(p.name)+'\')">设为起点</button><button class="b bo bs" onclick="event.stopPropagation();setTo(\''+esc(p.name)+'\')">设为终点</button></div></div>';
    addPOIMkRest(p);
  });
  c.innerHTML=h;toast('搜索完成，共 '+total+' 个结果');
}

function addPOIMkRest(p){
  if(!p.location)return;
  var loc=p.location.split(',');
  var mk=new A.Marker({position:[parseFloat(loc[0]),parseFloat(loc[1])],title:p.name,offset:new A.Pixel(-13,-30)});
  mk.setContent('<div style="background:var(--pri);color:#fff;padding:2px 8px;border-radius:12px;font-size:12px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)">'+p.name+'</div>');
  var iw=new A.InfoWindow({content:'<div style="padding:8px;max-width:260px"><div style="font-weight:600;margin-bottom:4px">'+p.name+'</div><div style="font-size:12px;color:#666">'+(p.address||'')+'</div>'+(p.tel?'<div style="font-size:12px;color:#666;margin-top:2px">'+p.tel+'</div>':'')+'</div>',offset:new A.Pixel(0,-30)});
  mk.on('click',function(){iw.open(map,mk.getPosition())});
  mk.setMap(map);poiMks.push(mk);
}
function clrPOI(){poiMks.forEach(function(m){m.setMap(null)});poiMks=[]}
function panTo(lng,lat){if(map){map.setCenter([lng,lat]);map.setZoom(16)}}
function setFrom(n){document.getElementById('fromIpt').value=n;switchTab('route');toast('已设为起点')}
function setTo(n){document.getElementById('toIpt').value=n;switchTab('route');toast('已设为终点')}

// 地图视角控制
function setStyle(s){if(!map)return;curStyle=s;map.setMapStyle('amap://styles/'+s);toast('已切换样式')}

function doHotSearch(){
  var q=document.getElementById('hotIpt').value.trim();
  if(!q){initHotTags();return}
  // 解析城市+分类
  var city='',cat='';
  var cityNames=Object.keys(CITY_DB);
  for(var i=0;i<cityNames.length;i++){if(q.indexOf(cityNames[i])===0){city=cityNames[i];break}}
  if(!city){
    // 尝试模糊匹配
    for(var j=0;j<cityNames.length;j++){if(q.indexOf(cityNames[j])>=0){city=cityNames[j];break}}
  }
  if(/美食|吃|火锅|串串|小吃|早餐|宵夜|烧烤|粉|面|餐厅/.test(q))cat='food';
  else if(/景点|玩|打卡|旅游|公园|寺|古镇|山|海|岛|博物馆/.test(q))cat='scenic';
  else if(/酒店|住|民宿|宾馆|度假|客栈/.test(q))cat='hotel';
  var keyword=q;
  if(city)keyword=q.replace(city,'').trim();
  if(!cat){if(keyword)cat='food';else cat='food';}
  var c=document.getElementById('hotRes');
  if(!city){
    // 非内置城市，提供小红书/抖音跳转
    var searchKw=q;
    c.innerHTML='<div style="text-align:center;padding:30px 20px;color:var(--txt2)"><div style="font-size:40px;margin-bottom:8px">🔍</div><p>暂无"'+esc(q)+'"的内置热榜数据</p><p style="font-size:12px;margin-top:4px">试试搜索小红书或抖音获取实时推荐</p></div>';
    c.innerHTML+='<div style="display:flex;gap:10px;margin-top:12px"><button class="b bp bk" style="background:#FF2442" onclick="openXHS(\''+escAttr(searchKw)+'\')">小红书搜索</button><button class="b bk" style="background:#1A1A1A;color:#fff;border:none" onclick="openDY(\''+escAttr(searchKw)+'\')">抖音搜索</button></div>';
    return;

function tryOpenApp(scheme,fallback){
  var iframe=document.createElement('iframe');

  iframe.src=scheme;
  var opened=false;
  var onBlur=function(){opened=true};

function escAttr(s){return s.replace(/'/g,"\'").replace(/"/g,'&quot;')}

// 定位 - 高精度策略：watchPosition 持续获取直到精度<200m
var watchId=null,bestPos=null,bestAcc=Infinity;
function locateMe(){
  if(!ready)return;
  var btns=document.querySelectorAll('.loc-btn-sm');
  btns.forEach(function(b){b.classList.add('spin-anim')});
  bestPos=null;bestAcc=Infinity;
  if(navigator.geolocation){
    // 用 watchPosition 持续监听，GPS 精度会逐步收敛
    watchId=navigator.geolocation.watchPosition(function(pos){
      var lng=pos.coords.longitude,lat=pos.coords.latitude,acc=pos.coords.accuracy||9999;
      // 记录精度最好的一次
      if(acc<bestAcc){
        bestAcc=acc;bestPos=[lng,lat,acc];
        myPos=[lng,lat];
        map.setCenter(myPos);
        // 精度够好时立即锁定
        if(acc<200){
          map.setZoom(16);
          finishLocate(lng,lat,'高精度定位 ('+Math.round(acc)+'m)');
          clearWatch();
        }else if(acc<500){
          map.setZoom(15);
        }else{
          map.setZoom(14);
        }
      }
    },function(){
      // watch 报错→尝试 IP 定位兜底
      clearWatch();ipLocate();
    },{enableHighAccuracy:true,timeout:15000,maximumAge:0});
    // 8秒后如果还没拿到<200m精度，取当前最佳结果
    setTimeout(function(){
      if(bestPos){
        map.setZoom(bestAcc<500?15:14);
        finishLocate(bestPos[0],bestPos[1],'定位完成 ('+Math.round(bestAcc)+'m)');
      }else{
        ipLocate();
      }
    },8000);
  }else{
    ipLocate();
  }
}
function clearWatch(){
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
}
// IP定位兜底（精度通常几公里）
function ipLocate(){
  fetch('https://restapi.amap.com/v3/ip?key='+KEY)
    .then(function(r){return r.json()})
    .then(function(data){
      if(data.status==='1'&&data.rectangle){
        var pts=data.rectangle.split(';');
        var p1=pts[0].split(','),p2=pts[1].split(',');
        var lng=(parseFloat(p1[0])+parseFloat(p2[0]))/2;
        var lat=(parseFloat(p1[1])+parseFloat(p2[1]))/2;
        myPos=[lng,lat];map.setCenter(myPos);map.setZoom(13);
        finishLocate(lng,lat,'IP定位');
      }else{
        var c=map.getCenter();
        finishLocate(c.lng,c.lat,'使用地图中心');
      }
    })
    .catch(function(){
      var c=map.getCenter();
      finishLocate(c.lng,c.lat,'定位失败');
    });
}
// 定位完成：逆编码+写输入框+停止动画
function finishLocate(lng,lat,hint){
  reverseGeo(lng,lat,hint);
}
// 逆地理编码：坐标→地址名
function reverseGeo(lng,lat,hint){
  fetch('https://restapi.amap.com/v3/geocode/regeo?key='+KEY+'&location='+lng.toFixed(6)+','+lat.toFixed(6)+'&extensions=base')
    .then(function(r){return r.json()})
    .then(function(data){
      var locText='';
      if(data.status==='1'&&data.regeocode){
        var comp=data.regeocode.addressComponent;
        locText=(comp.city||comp.province||'')+(comp.district||'');
        if(!locText)locText=data.regeocode.formatted_address||'';
      }
      if(locText){
        document.getElementById('cityIpt').value=locText;
        document.getElementById('sCityIpt').value=locText;
        document.getElementById('cityIpt').placeholder='输入位置或城市名';
        document.getElementById('sCityIpt').placeholder='输入位置或城市名';
      }
      var btns=document.querySelectorAll('.loc-btn-sm');
      btns.forEach(function(b){b.classList.remove('spin-anim')});
      toast((hint||'已定位')+': '+locText);
    })
    .catch(function(){
      var btns=document.querySelectorAll('.loc-btn-sm');
      btns.forEach(function(b){b.classList.remove('spin-anim')});
      toast(hint||'定位完成');
    });
}

// ==================== 时间线 ====================
var TL_KEY='travel_timeline_v2';
var tlData=null; // 缓存
var tlFilter='all'; // 当前筛选

function loadTl(){
  try{var s=localStorage.getItem(TL_KEY);tlData=s?JSON.parse(s):[]}catch(e){tlData=[]}
  if(!Array.isArray(tlData))tlData=[];
  return tlData;
}
function saveTl(){
  localStorage.setItem(TL_KEY,JSON.stringify(tlData));
}

// 渲染时间线主面板
function renderTl(){
  var data=loadTl();
  var statsEl=document.getElementById('tlStats');
  var filterEl=document.getElementById('tlFilter');
  var contentEl=document.getElementById('tlContent');

  // 统计
  var total=data.length;
  var done=data.filter(function(x){return x.status==='done'}).length;
  var pending=total-done;
  if(total>0){
    statsEl.style.display='flex';
    statsEl.innerHTML='<div class="tl-stat"><div class="num">'+total+'</div><div class="lab">总计</div></div>'
      +'<div class="tl-stat"><div class="num" style="color:var(--ok)">'+done+'</div><div class="lab">已打卡</div></div>'
      +'<div class="tl-stat"><div class="num" style="color:var(--warn)">'+pending+'</div><div class="lab">待打卡</div></div>';
  }else{
    statsEl.style.display='none';
  }

  // 筛选条
  if(total>0){
    filterEl.style.display='flex';
    var chips=[{k:'all',l:'全部'},{k:'food',l:'🍜 美食'},{k:'scenic',l:'🎡 景点'},{k:'hotel',l:'🏨 酒店'},{k:'pending',l:'待打卡'},{k:'done',l:'已打卡'}];
    filterEl.innerHTML=chips.map(function(c){
      return '<span class="tl-chip'+(tlFilter===c.k?' on':'')+'" onclick="filterTl(\''+c.k+'\')">'+c.l+'</span>';
    }).join('');
  }else{
    filterEl.style.display='none';
  }

  // 筛选数据
  var filtered=data;
  if(tlFilter==='food'||tlFilter==='scenic'||tlFilter==='hotel'){
    filtered=data.filter(function(x){return x.type===tlFilter});
  }else if(tlFilter==='pending'){
    filtered=data.filter(function(x){return x.status==='pending'});
  }else if(tlFilter==='done'){
    filtered=data.filter(function(x){return x.status==='done'});
  }

  // 按日期分组（降序）
  var groups={};
  filtered.forEach(function(item){
    var d=item.date||'未设置日期';
    if(!groups[d])groups[d]=[];
    groups[d].push(item);
  });
  var dates=Object.keys(groups).sort(function(a,b){
    if(a==='未设置日期')return 1;
    if(b==='未设置日期')return -1;
    return b.localeCompare(a);
  });

  if(total===0){
    contentEl.innerHTML='<div class="empty"><div style="font-size:40px;margin-bottom:8px">📅</div><p>还没有旅行打卡计划</p><p style="font-size:12px;margin-top:4px">热榜搜索后添加，或手动创建</p></div>';
    return;
  }

  if(filtered.length===0){
    contentEl.innerHTML='<div class="empty" style="padding:30px 20px"><p>没有符合筛选条件的项目</p></div>';
    return;
  }

  var h='';
  dates.forEach(function(date){
    var items=groups[date];
    var dateDone=items.filter(function(x){return x.status==='done'}).length;
    var dateTotal=items.length;
    var pct=dateTotal>0?Math.round(dateDone/dateTotal*100):0;

    h+='<div class="tl-date-grp">';
    h+='<div class="tl-date-lbl" onclick="toggleTlDate(this)"><span class="arr">▼</span> '+esc(date)+' <span style="font-weight:400;font-size:12px;color:var(--txt3)">'+dateDone+'/'+dateTotal+' 完成 ('+pct+'%)</span></div>';

    // 进度条
    h+='<div class="tl-prog-bar"><div class="tl-prog-track">';
    // 按时间段排序（有startTime的）
    var sorted=items.slice().sort(function(a,b){
      var ta=a.startTime||'99',tb=b.startTime||'99';
      return ta.localeCompare(tb);
    });
    var trackWidth=100; // 百分比宽度
    sorted.forEach(function(it){
      var s=parseInt(it.startTime)||0,e=parseInt(it.endTime)||23;
      var left=Math.round(s/24*trackWidth);
      var width=Math.max(Math.round((e-s)/24*trackWidth),4);
      var cls=it.type+(it.status==='done'?' is-done':' not-done');
      h+='<div class="tl-prog-block '+cls+'" style="left:'+left+'%;width:'+width+'%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;padding:0 2px" title="'+esc(it.name)+'">'+esc(it.name)+'</div>';
    });
    h+='</div>';
    // 时间刻度
    h+='<div class="tl-prog-ticks">';
    var ticks=[0,3,6,9,12,15,18,21,24];
    ticks.forEach(function(t){h+='<div class="tl-prog-tick"><span>'+t+'</span></div>'});
    h+='</div></div>';

    // 卡片列表
    h+='<div class="tl-date-items">';
    sorted.forEach(function(item){
      var typeBadge=itTypeLabel(item.type);
      var statusCls=item.status==='done'?'completed':'pending';
      var statusTxt=item.status==='done'?'已打卡':'待打卡';
      var doneCls=item.status==='done'?' done':'';
      h+='<div class="tl-card type-'+item.type+doneCls+'">';
      h+='<div class="tl-card-top"><span class="tl-type-badge '+item.type+'">'+typeBadge+'</span><button class="tl-status '+statusCls+'" onclick="toggleTlStatus('+item.id+')">'+statusTxt+'</button></div>';
      h+='<div class="tl-card-name">'+esc(item.name)+'</div>';
      h+='<div class="tl-card-city">📍 '+esc(item.city)+'</div>';
      if(item.note)h+='<div class="tl-card-note">'+esc(item.note)+'</div>';
      if(item.status==='pending'&&item.reason)h+='<div class="tl-card-reason">原因: '+esc(item.reason)+'</div>';
      if(item.startTime||item.endTime)h+='<div class="tl-card-time">⏰ '+((item.startTime||'?')+'时 - '+(item.endTime||'?')+'时')+'</div>';
      h+='<div class="tl-actions">';
      h+='<button class="tl-act done-act" onclick="toggleTlStatus('+item.id+')">'+(item.status==='done'?'取消完成':'完成打卡')+'</button>';
      h+='<button class="tl-act" onclick="editTlItem('+item.id+')">编辑</button>';
      h+='<button class="tl-act del" onclick="deleteTlItem('+item.id+')">删除</button>';
      h+='</div>';
      h+='</div>';
    });
    h+='</div></div>';
  });

  contentEl.innerHTML=h;
}

function itTypeLabel(t){return t==='food'?'🍜 美食':t==='scenic'?'🎡 景点':'🏨 酒店'}

  var city=document.getElementById('mCity').value.trim();
  var name=document.getElementById('mName').value.trim();
  if(!city||!name){toast('请填写城市和地点名称');return}
  var typeEl=document.getElementById('mTypePicker').querySelector('.tl-type.on');
  var type=typeEl?typeEl.getAttribute('data-t'):'food';
  var item={
    id:Date.now(),
    city:city,
    name:name,
    type:type,
    date:document.getElementById('mDate').value||'',
    startTime:document.getElementById('mStart').value||'',
    endTime:document.getElementById('mEnd').value||'',
    note:document.getElementById('mNote').value.trim(),
    reason:document.getElementById('mReason').value.trim(),
    status:'pending',
    createdAt:new Date().toISOString()
  };
  loadTl();
  tlData.push(item);
  saveTl();
  closeTlModal('tlAddModal');
  renderTl();
  toast('已添加: '+name);
}

// 编辑打卡
function editTlItem(id){
  loadTl();
  var item=tlData.find(function(x){return x.id===id});
  if(!item)return;
  document.getElementById('eId').value=id;
  document.getElementById('eCity').value=item.city||'';
  document.getElementById('eName').value=item.name||'';
  document.getElementById('eDate').value=item.date||'';
  document.getElementById('eStart').value=item.startTime||'';
  document.getElementById('eEnd').value=item.endTime||'';
  document.getElementById('eNote').value=item.note||'';
  document.getElementById('eReason').value=item.reason||'';
  document.getElementById('tlEditModal').classList.add('show');
}

function saveTlEdit(){
  var id=parseInt(document.getElementById('eId').value);
  loadTl();
  var item=tlData.find(function(x){return x.id===id});
  if(!item)return;
  item.city=document.getElementById('eCity').value.trim();
  item.name=document.getElementById('eName').value.trim();
  item.date=document.getElementById('eDate').value||'';
  item.startTime=document.getElementById('eStart').value||'';
  item.endTime=document.getElementById('eEnd').value||'';
  item.note=document.getElementById('eNote').value.trim();
  item.reason=document.getElementById('eReason').value.trim();
  saveTl();
  closeTlModal('tlEditModal');
  renderTl();
  toast('已更新: '+item.name);
}

// 切换打卡状态
function toggleTlStatus(id){
  loadTl();
  var item=tlData.find(function(x){return x.id===id});
  if(!item)return;
  if(item.status==='done'){
    item.status='pending';
  }else{
    item.status='done';
  }
  saveTl();
  renderTl();
  toast(item.status==='done'?'已打卡: '+item.name:'取消打卡: '+item.name);
}

// 删除打卡
function deleteTlItem(id){
  if(!confirm('确定删除这条打卡记录？'))return;
  loadTl();
  tlData=tlData.filter(function(x){return x.id!==id});
  saveTl();
  renderTl();
  toast('已删除');
}

// 关闭弹窗
function closeTlModal(mid){
  document.getElementById(mid).classList.remove('show');
}

// 导出CSV
function exportTl(){
  loadTl();
  if(tlData.length===0){toast('暂无数据可导出');return}
  var header='城市,地点名称,类型,计划日期,开始时间,结束时间,备注,未完成原因,状态\n';
  var rows=tlData.map(function(it){
    return [it.city,it.name,itTypeLabel(it.type),it.date,it.startTime||'',it.endTime||'',it.note||'',it.reason||'',it.status==='done'?'已打卡':'待打卡'].map(function(v){return '"'+String(v).replace(/"/g,'""')+'"'}).join(',');
  });
  var csv='\uFEFF'+header+rows.join('\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='旅行时间线_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('导出成功');
}

// 从热榜添加到时间线
function addTlFromHot(city,name,type){
  showTlAdd(city,name,type);
}

// 工具
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},2000)}
function esc(s){return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function escAttr(s){return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function restoreURL(){try{var p=new URLSearchParams(location.search),ln=parseFloat(p.get('lng')),la=parseFloat(p.get('lat')),z=parseInt(p.get('zoom')),s=p.get('style');if(ln&&la&&map)map.setCenter([ln,la]);if(z&&map)map.setZoom(z);if(s)setStyle(s)}catch(e){}}
</script>
