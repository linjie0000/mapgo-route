<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>MapGo 地图搜索路线</title>
<style>
:root{--pri:#1677ff;--pri-l:#e6f0ff;--ok:#52c41a;--warn:#faad14;--err:#ff4d4f;--bg:#f5f5f5;--card:#fff;--txt:#1a1a1a;--txt2:#666;--bd:#e8e8e8;--sh:0 2px 12px rgba(0,0,0,.1)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);overflow:hidden;height:100vh}

.hdr{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;padding:0 12px;height:52px;gap:8px}
.hdr .logo{font-size:18px;font-weight:700;color:var(--pri);white-space:nowrap}
.hdr .logo em{font-style:normal;font-size:12px;font-weight:400;color:var(--txt2);margin-left:4px}
.hdr .rb{margin-left:auto;display:flex;gap:6px}
.hdr .rb button{padding:4px 10px;border-radius:16px;border:1px solid var(--bd);background:var(--card);font-size:12px;cursor:pointer;white-space:nowrap}
.hdr .rb button:hover{background:var(--pri-l);border-color:var(--pri);color:var(--pri)}

.pnl{position:fixed;top:52px;left:0;width:380px;bottom:0;z-index:900;background:var(--card);box-shadow:2px 0 12px rgba(0,0,0,.06);display:flex;flex-direction:column;transition:transform .3s}
.pnl.hide{transform:translateX(-100%)}
.pnl-tog{position:fixed;top:60px;left:380px;z-index:901;width:28px;height:48px;background:var(--card);border-radius:0 8px 8px 0;box-shadow:var(--sh);border:none;cursor:pointer;font-size:14px;color:var(--txt2);transition:left .3s}
.pnl.hide~.pnl-tog{left:0}
.tabs{display:flex;border-bottom:1px solid var(--bd);flex-shrink:0}
.tab{flex:1;padding:10px;text-align:center;font-size:14px;cursor:pointer;color:var(--txt2);border-bottom:2px solid transparent;transition:all .2s}
.tab.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.body{flex:1;overflow-y:auto;padding:12px}

.grp{margin-bottom:12px}
.grp label{display:block;font-size:12px;color:var(--txt2);margin-bottom:4px}
.iwrap{display:flex;align-items:center;background:var(--bg);border-radius:8px;border:1px solid var(--bd);transition:border-color .2s}
.iwrap:focus-within{border-color:var(--pri)}
.iwrap .ic{padding:0 8px;color:var(--txt2);font-size:16px;flex-shrink:0}
.iwrap input{flex:1;border:none;outline:none;padding:10px 8px;font-size:14px;background:transparent;min-width:0}
.iwrap .xb{padding:4px 8px;cursor:pointer;color:var(--txt2);font-size:18px;display:none;flex-shrink:0;background:none;border:none}
.iwrap .xb:hover{color:var(--err)}

.b{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:8px 16px;border-radius:8px;border:none;font-size:14px;cursor:pointer;transition:all .2s;font-weight:500}
.bp{background:var(--pri);color:#fff}.bp:hover{background:#0958d9}
.bo{background:transparent;border:1px solid var(--bd);color:var(--txt)}.bo:hover{border-color:var(--pri);color:var(--pri)}
.bs{padding:4px 10px;font-size:12px}
.bk{width:100%}

.modes{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.mc{padding:6px 14px;border-radius:20px;border:1px solid var(--bd);font-size:13px;cursor:pointer;transition:all .2s;background:var(--card);user-select:none}
.mc.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.mc:hover:not(.on){border-color:var(--pri);color:var(--pri)}

.pc{padding:10px;border-radius:8px;border:1px solid var(--bd);margin-bottom:8px;cursor:pointer;transition:all .2s;background:var(--card)}
.pc:hover{border-color:var(--pri);box-shadow:0 2px 8px rgba(22,119,255,.1)}
.pc .pn{font-size:14px;font-weight:600;margin-bottom:2px}
.pc .pa{font-size:12px;color:var(--txt2)}
.pc .pd{font-size:12px;color:var(--pri);margin-top:2px}
.pc .pab{margin-top:6px;display:flex;gap:6px}

.rs{background:var(--pri-l);border-radius:8px;padding:12px;margin-bottom:12px}
.rs .rt{font-size:24px;font-weight:700;color:var(--pri)}
.rs .rd{font-size:14px;color:var(--txt2);margin-top:2px}
.step{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.step:last-child{border-bottom:none}
.step .dot{width:8px;height:8px;border-radius:50%;background:var(--pri);margin-top:6px;flex-shrink:0}
.step .st{font-size:13px;color:var(--txt);line-height:1.5}
.step .sm{font-size:12px;color:var(--txt2)}

.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.si{padding:8px;border-radius:8px;border:2px solid var(--bd);text-align:center;cursor:pointer;font-size:12px;transition:all .2s}
.si.on{border-color:var(--pri);color:var(--pri);background:var(--pri-l)}
.si:hover{border-color:var(--pri)}

.collapse-hd{font-size:13px;color:var(--txt2);cursor:pointer;margin:8px 0;display:flex;align-items:center;gap:4px;user-select:none;font-weight:500;padding:6px 0}
.collapse-hd:hover{color:var(--pri)}
.collapse-bd{overflow:hidden;height:0;transition:height .25s ease-out}
.collapse-bd.show{height:auto;overflow:visible}

.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2000;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:12px;padding:20px;width:90%;max-width:400px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{font-size:16px;margin-bottom:12px}
.modal textarea{width:100%;height:100px;border:1px solid var(--bd);border-radius:8px;padding:8px;font-size:13px;resize:none}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#333;color:#fff;padding:8px 20px;border-radius:20px;font-size:13px;z-index:3000;opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#mapBox{position:fixed;top:52px;left:380px;right:0;bottom:0}
.loc-btn{position:fixed;right:12px;bottom:24px;z-index:800;width:44px;height:44px;border-radius:50%;background:var(--card);box-shadow:var(--sh);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;transition:transform .2s}
.loc-btn:hover{transform:scale(1.1)}

.empty{text-align:center;padding:40px 20px;color:var(--txt2)}
.pagi{display:flex;justify-content:center;gap:8px;margin-top:12px}
.pagi button{padding:4px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--card);cursor:pointer}
.pagi button:disabled{opacity:.4;cursor:default}

.ac{position:fixed;z-index:1100;background:var(--card);border:1px solid var(--bd);border-radius:0 0 8px 8px;max-height:200px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.ac div{padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--bg)}
.ac div:hover{background:var(--pri-l)}

.spin{display:inline-block;width:20px;height:20px;border:2px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.wp-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.wp-row input{flex:1;padding:8px;border:1px solid var(--bd);border-radius:8px;font-size:13px}
.wp-row .del{cursor:pointer;color:var(--err);font-size:18px;background:none;border:none}

.sel select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--bd);font-size:13px;background:var(--bg)}

@media(max-width:768px){
  .pnl{top:auto;left:0;right:0;bottom:0;width:100%;height:50vh;border-radius:16px 16px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.1)}
  .pnl.hide{transform:translateY(100%)}
  .pnl-tog{top:auto;bottom:52vh;left:50%;transform:translateX(-50%);width:48px;height:28px;border-radius:8px 8px 0 0}
  .pnl.hide~.pnl-tog{bottom:0}
  #mapBox{left:0;bottom:50vh}
  .ac{width:calc(100vw - 24px)}
}
.body::-webkit-scrollbar{width:4px}
.body::-webkit-scrollbar-thumb{background:#ccc;border-radius:2px}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">MapGo<em>地图搜索路线</em></div>
  <div class="rb">
    <button onclick="switchTab('style')">样式</button>
    <button onclick="openShare()">分享</button>
  </div>
</div>

<div class="pnl" id="pnl">
  <div class="tabs">
    <div class="tab on" data-t="route" onclick="switchTab('route')">路线</div>
    <div class="tab" data-t="search" onclick="switchTab('search')">搜索</div>
    <div class="tab" data-t="style" onclick="switchTab('style')">样式</div>
  </div>

  <div class="body" id="pRoute">
    <div class="modes">
      <div class="mc on" data-m="driving" onclick="setMode('driving')">驾车</div>
      <div class="mc" data-m="transit" onclick="setMode('transit')">公交</div>
      <div class="mc" data-m="walking" onclick="setMode('walking')">步行</div>
      <div class="mc" data-m="riding" onclick="setMode('riding')">骑行</div>
    </div>
    <div class="grp"><label>起点</label>
      <div class="iwrap"><span class="ic">📍</span><input id="fromIpt" placeholder="输入起点（留空则用当前位置）" oninput="onAC('from')"><button class="xb" onclick="clr('from')">×</button></div>
    </div>
    <div class="grp"><label>终点</label>
      <div class="iwrap"><span class="ic">🎯</span><input id="toIpt" placeholder="输入终点" oninput="onAC('to')"><button class="xb" onclick="clr('to')">×</button></div>
    </div>
    <div id="wpSec" style="display:none">
      <div class="collapse-hd" onclick="toggleC('wp')">▶ 途经点（可选）</div>
      <div class="collapse-bd" id="wp"><div id="wpList"></div><button class="b bo bs" onclick="addWP()">+ 添加途经点</button></div>
    </div>
    <div id="citySec" style="display:none"><div class="grp"><label>城市</label><div class="iwrap"><span class="ic">🏙</span><input id="cityIpt" placeholder="如：北京"></div></div></div>
    <div>
      <div class="collapse-hd" onclick="toggleC('adv')">▶ 高级选项</div>
      <div class="collapse-bd sel" id="adv">
        <div id="dPolicy"><select id="dPolSel"><option value="0">最快</option><option value="1">最短</option><option value="2">少收费</option><option value="3">不走高速</option><option value="4">躲避拥堵</option></select></div>
        <div id="tPolicy" style="display:none"><select id="tPolSel"><option value="0">最快</option><option value="1">最少花费</option><option value="2">少步行</option><option value="3">最舒适</option><option value="4">不乘地铁</option></select></div>
      </div>
    </div>
    <button class="b bp bk" style="margin-top:12px" onclick="doRoute()">开始规划</button>
    <div id="routeRes" style="margin-top:12px"></div>
  </div>

  <div class="body" id="pSearch" style="display:none">
    <div class="grp"><label>搜索关键词</label>
      <div class="iwrap"><span class="ic">🔍</span><input id="kwIpt" placeholder="如：星巴克、停车场、景点" oninput="onAC('kw')"><button class="xb" onclick="clr('kw')">×</button></div>
    </div>
    <div class="grp"><label>城市 / 区域</label>
      <div class="iwrap"><span class="ic">🏙</span><input id="sCityIpt" placeholder="如：北京、上海"></div>
    </div>
    <div>
      <div class="collapse-hd" onclick="toggleC('nearby')">▶ 周边搜索（可选）</div>
      <div class="collapse-bd" id="nearby">
        <div style="display:flex;gap:8px"><div style="flex:1"><label style="font-size:12px;color:var(--txt2)">经度</label><input type="number" id="sLng" placeholder="116.397" step="0.001" style="width:100%;padding:6px;border:1px solid var(--bd);border-radius:6px;font-size:13px"></div><div style="flex:1"><label style="font-size:12px;color:var(--txt2)">纬度</label><input type="number" id="sLat" placeholder="39.909" step="0.001" style="width:100%;padding:6px;border:1px solid var(--bd);border-radius:6px;font-size:13px"></div></div>
        <div style="margin-top:6px"><label style="font-size:12px;color:var(--txt2)">搜索半径（米）</label><input type="number" id="sRad" placeholder="3000" value="3000" style="width:100%;padding:6px;border:1px solid var(--bd);border-radius:6px;font-size:13px"></div>
      </div>
    </div>
    <button class="b bp bk" style="margin-top:12px" onclick="doSearch()">搜索</button>
    <div id="searchRes" style="margin-top:12px"></div>
  </div>

  <div class="body" id="pStyle" style="display:none">
    <p style="font-size:14px;margin-bottom:8px">选择地图样式</p>
    <div class="sg" id="styleGrid"></div>
    <div style="margin-top:16px">
      <p style="font-size:14px;margin-bottom:8px">地图视角</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div style="flex:1;min-width:80px"><label style="font-size:12px;color:var(--txt2)">缩放</label><input type="range" id="zoomR" min="3" max="20" value="12" oninput="map&&map.setZoom(+this.value)" style="width:100%"></div>
        <div style="flex:1;min-width:80px"><label style="font-size:12px;color:var(--txt2)">俯仰</label><input type="range" id="pitchR" min="0" max="83" value="0" oninput="map&&map.setPitch(+this.value)" style="width:100%"></div>
        <div style="flex:1;min-width:80px"><label style="font-size:12px;color:var(--txt2)">旋转</label><input type="range" id="rotR" min="0" max="360" value="0" oninput="map&&map.setRotation(+this.value)" style="width:100%"></div>
      </div>
    </div>
  </div>
</div>

<button class="pnl-tog" id="pnlTog" onclick="togPnl()">◀</button>
<div id="mapBox"></div>
<button class="loc-btn" onclick="locateMe()">📍</button>
<div class="toast" id="toast"></div>
<div class="ac" id="acBox" style="display:none"></div>

<div class="modal-bg" id="shareModal">
  <div class="modal"><h3>分享当前地图</h3><textarea id="shareTxt" readonly></textarea>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="b bp" onclick="copyShare()">复制</button><button class="b bo" onclick="closeShare()">关闭</button></div>
  </div>
</div>

<script src="https://webapi.amap.com/loader.js"></script>
<script>
var KEY='d32b4be5e03b0b30b6fe6909be6d84f6',SKEY='';
var A=null,map=null,ready=false,mode='driving',curStyle='normal',poiMks=[],acTmr=null;
var myPos=null; // 当前位置坐标

var STYLES=['normal','dark','light','whitesmoke','fresh','grey','graffiti','macaron','blue','darkblue','wine'];
var SNAME={'normal':'标准','dark':'幻影黑','light':'月光银','whitesmoke':'远山黛','fresh':'草色青','grey':'雅士灰','graffiti':'涂鸦','macaron':'马卡龙','blue':'靛青蓝','darkblue':'极夜蓝','wine':'酱籽'};

// ==================== 加载 ====================
window.onload=function(){
  document.getElementById('mapBox').innerHTML='<div class="empty" style="padding-top:80px"><div class="spin" style="margin:0 auto 12px"></div><p>地图加载中...</p></div>';
  window._AMapSecurityConfig={securityJsCode:SKEY||''};
  AMapLoader.load({key:KEY,version:'2.0',plugins:['AMap.Geocoder','AMap.Driving','AMap.Walking','AMap.Riding','AMap.Transfer','AMap.PlaceSearch','AMap.AutoComplete','AMap.Geolocation']}).then(function(AMap){
    A=AMap;window.AMap=AMap;
    map=new A.Map('mapBox',{zoom:12,center:[116.397,39.909],mapStyle:'amap://styles/normal',viewMode:'3D'});
    map.on('click',function(e){toast('位置: '+e.lnglat.getLng().toFixed(6)+', '+e.lnglat.getLat().toFixed(6))});
    ready=true;initGrid();toast('地图加载成功');restoreURL();locateMe();
  }).catch(function(e){
    console.error('加载失败:',e);
    document.getElementById('mapBox').innerHTML='<div class="empty" style="padding-top:60px"><div style="font-size:48px;color:var(--err)">✗</div><p style="margin-top:12px">地图加载失败</p><p style="margin-top:8px;font-size:12px;color:var(--txt2)">请在 lbs.amap.com 确认：<br>1. Key 类型为「Web端(JS API)」<br>2. 域名白名单留空或添加 *<br>3. 新Key需配置安全密钥</p></div>';
  });
};

// ==================== Geocoder 地理编码（地名→坐标）====================
function geocode(address){
  return new Promise(function(resolve,reject){
    if(!address){resolve(null);return}
    // 如果已经是坐标格式 "lng,lat"，直接返回
    var parts=address.split(',');
    if(parts.length===2&&!isNaN(parseFloat(parts[0]))&&!isNaN(parseFloat(parts[1]))){
      resolve(new A.LngLat(parseFloat(parts[0]),parseFloat(parts[1])));
      return;
    }
    var geo=new A.Geocoder({city:'全国'});
    geo.getLocation(address,function(status,result){
      if(status==='complete'&&result.geocodes&&result.geocodes.length>0){
        var loc=result.geocodes[0].location;
        resolve(new A.LngLat(loc.lng,loc.lat));
      }else{
        reject(new Error('无法解析地址: '+address));
      }
    });
  });
}

// ==================== 面板 ====================
function switchTab(t){
  document.querySelectorAll('.tab').forEach(function(e){e.classList.remove('on')});
  document.querySelector('.tab[data-t="'+t+'"]').classList.add('on');
  document.getElementById('pRoute').style.display=t==='route'?'block':'none';
  document.getElementById('pSearch').style.display=t==='search'?'block':'none';
  document.getElementById('pStyle').style.display=t==='style'?'block':'none';
  var p=document.getElementById('pnl');if(p.classList.contains('hide'))togPnl();
}
function togPnl(){var p=document.getElementById('pnl'),b=document.getElementById('pnlTog');p.classList.toggle('hide');b.textContent=p.classList.contains('hide')?'▶':'◀'}

// 出行方式
function setMode(m){
  mode=m;
  document.querySelectorAll('.mc').forEach(function(e){e.classList.remove('on')});
  document.querySelector('.mc[data-m="'+m+'"]').classList.add('on');
  document.getElementById('wpSec').style.display=m==='driving'?'block':'none';
  document.getElementById('citySec').style.display=m==='transit'?'block':'none';
  document.getElementById('dPolicy').style.display=m==='driving'?'block':'none';
  document.getElementById('tPolicy').style.display=m==='transit'?'block':'none';
}

// 折叠 — 用 height:auto 方案，彻底解决 display:none 子元素不计算高度的问题
function toggleC(id){
  var bd=document.getElementById(id);if(!bd)return;
  var hd=bd.previousElementSibling;
  if(bd.classList.contains('show')){
    bd.classList.remove('show');bd.style.height='0';
    if(hd)hd.textContent=hd.textContent.replace('▼','▶');
  }else{
    bd.classList.add('show');bd.style.height='auto';
    if(hd)hd.textContent=hd.textContent.replace('▶','▼');
  }
}

// 途经点
function addWP(){var l=document.getElementById('wpList'),i=l.children.length;if(i>=16){toast('最多16个途经点');return}var d=document.createElement('div');d.className='wp-row';d.innerHTML='<input type="text" placeholder="途经点'+(i+1)+'"><button class="del" onclick="this.parentElement.remove()">×</button>';l.appendChild(d)}

// ==================== 路线规划（修复：先 geocode 再规划）====================
function doRoute(){
  if(!ready){toast('地图尚未加载');return}
  var fromStr=document.getElementById('fromIpt').value.trim();
  var toStr=document.getElementById('toIpt').value.trim();
  if(!toStr){toast('请输入终点');return}
  document.getElementById('routeRes').innerHTML='<div style="text-align:center;padding:12px"><div class="spin" style="margin:0 auto 8px"></div><div style="font-size:13px;color:var(--txt2)">路线规划中...</div></div>';

  // 先把起点/终点/途经点全部 geocode
  var tasks=[];
  var fromPos=null,toPos=null,wpPositions=[];

  // 起点
  if(fromStr){
    tasks.push(geocode(fromStr).then(function(p){fromPos=p}));
  }
  // 终点
  tasks.push(geocode(toStr).then(function(p){toPos=p}));
  // 途经点
  var wpEls=document.querySelectorAll('.wp-row input');
  wpEls.forEach(function(el){
    var v=el.value.trim();
    if(v) tasks.push(geocode(v).then(function(p){wpPositions.push(p)}));
  });

  Promise.all(tasks).then(function(){
    if(!toPos){toast('无法解析终点地址');document.getElementById('routeRes').innerHTML='';return}
    try{
      if(mode==='driving') rDriv(fromPos,toPos,wpPositions);
      else if(mode==='walking') rWalk(fromPos,toPos);
      else if(mode==='riding') rRide(fromPos,toPos);
      else if(mode==='transit') rTrans(fromPos,toPos);
    }catch(e){console.error(e);document.getElementById('routeRes').innerHTML='';toast('规划出错: '+e.message)}
  }).catch(function(e){
    console.error(e);document.getElementById('routeRes').innerHTML='';toast('地址解析失败: '+e.message);
  });
}

function rDriv(fromPos,toPos,wpPos){
  var pol=parseInt(document.getElementById('dPolSel').value);
  var driving=new A.Driving({map:map,policy:pol});
  if(wpPos.length>0){
    driving.search(fromPos,toPos,{waypoints:wpPos},function(s,r){onRouteDone(s,r,'driving')});
  }else{
    driving.search(fromPos,toPos,function(s,r){onRouteDone(s,r,'driving')});
  }
}

function rWalk(fromPos,toPos){var w=new A.Walking({map:map});w.search(fromPos,toPos,function(s,r){onRouteDone(s,r,'walking')})}
function rRide(fromPos,toPos){var r=new A.Riding({map:map});r.search(fromPos,toPos,function(s,r){onRouteDone(s,r,'riding')})}
function rTrans(fromPos,toPos){
  var city=document.getElementById('cityIpt').value.trim();
  if(!city){toast('公交模式请输入城市');document.getElementById('routeRes').innerHTML='';return}
  var pol=parseInt(document.getElementById('tPolSel').value);
  var t=new A.Transfer({map:map,city:city,policy:pol});
  t.search(fromPos,toPos,function(s,r){onRouteDone(s,r,'transit')});
}

function onRouteDone(status,result,type){
  if(status==='complete') renderRoute(result,type);
  else{document.getElementById('routeRes').innerHTML='';toast('路线规划失败')}
}

function renderRoute(result,type){
  var c=document.getElementById('routeRes'),dist=0,time=0,steps=[];
  try{
    if((type==='driving'||type==='walking')&&result.routes&&result.routes[0]){
      var r=result.routes[0];dist=r.distance;time=r.time;
      if(r.steps)r.steps.forEach(function(s){steps.push({ins:s.instruction,d:s.distance,t:s.time||0})});
    }else if(type==='riding'&&result.routes&&result.routes[0]){
      var r=result.routes[0];dist=r.distance;time=r.time;
      if(r.rides)r.rides.forEach(function(s){steps.push({ins:s.instruction,d:s.distance,t:0})});
    }else if(type==='transit'&&result.plans&&result.plans[0]){
      var r=result.plans[0];dist=r.distance||0;time=r.time||0;
      if(r.segments)r.segments.forEach(function(seg){
        var ins='';
        if(seg.transit_mode==='WALK'&&seg.walking&&seg.walking.steps)seg.walking.steps.forEach(function(s){ins+=s.instruction+' '});
        else if(seg.transit_mode==='TRANSIT'&&seg.transit)ins='乘坐 '+(seg.transit.lines&&seg.transit.lines[0]?seg.transit.lines[0].name:'公共交通');
        if(ins)steps.push({ins:ins,d:seg.distance||0,t:seg.time||0});
      });
    }
  }catch(e){console.error(e)}

  var mn={driving:'驾车',walking:'步行',riding:'骑行',transit:'公交'};
  var ds=dist>=1000?(dist/1000).toFixed(1)+' 公里':dist+' 米';
  var ts=time>=3600?Math.floor(time/3600)+' 时 '+Math.floor((time%3600)/60)+' 分':Math.ceil(time/60)+' 分钟';
  var h='<div class="rs"><div style="font-size:12px;color:var(--txt2)">'+mn[type]+'路线</div><div class="rt">'+ts+'</div><div class="rd">总距离 '+ds+'</div></div>';
  if(steps.length){h+='<div style="font-size:13px;font-weight:600;margin-bottom:8px">路线详情</div>';steps.forEach(function(s,i){
    var m=[];if(s.d>0)m.push(s.d>=1000?(s.d/1000).toFixed(1)+'km':s.d+'m');if(s.t>0)m.push(Math.ceil(s.t/60)+'min');
    h+='<div class="step"><div class="dot"></div><div><div class="st">'+(i+1)+'. '+s.ins+'</div>';if(m.length)h+='<div class="sm">'+m.join(' · ')+'</div>';h+='</div></div>';
  })}
  c.innerHTML=h;toast('路线规划完成');
}

// ==================== POI 搜索 ====================
function doSearch(){
  if(!ready){toast('地图尚未加载');return}
  var kw=document.getElementById('kwIpt').value.trim();if(!kw){toast('请输入关键词');return}
  clrPOI();
  document.getElementById('searchRes').innerHTML='<div style="text-align:center;padding:12px"><div class="spin" style="margin:0 auto 8px"></div><div style="font-size:13px;color:var(--txt2)">搜索中...</div></div>';
  var city=document.getElementById('sCityIpt').value.trim();
  var lng=document.getElementById('sLng').value,lat=document.getElementById('sLat').value,rad=parseInt(document.getElementById('sRad').value)||3000;
  var ps=new A.PlaceSearch({pageSize:10,extensions:'all'});
  if(lng&&lat){
    ps.searchNearBy(kw,[parseFloat(lng),parseFloat(lat)],rad,function(s,r){
      if(s==='complete'&&r.poiList)renderPOI(r.poiList);else{document.getElementById('searchRes').innerHTML='';toast('搜索失败')}
    });
  }else{
    ps.search(kw,city||undefined,function(s,r){
      if(s==='complete'&&r.poiList)renderPOI(r.poiList);else{document.getElementById('searchRes').innerHTML='';toast('搜索失败：'+(r.message||'无结果'))}
    });
  }
}

function renderPOI(list){
  var c=document.getElementById('searchRes'),pois=list.pois||[],total=list.count||0;
  var h='<div style="font-size:13px;color:var(--txt2);margin-bottom:8px">找到 '+total+' 个结果</div>';
  pois.forEach(function(p){
    var d=p.distance?(p.distance>=1000?(p.distance/1000).toFixed(1)+'km':p.distance+'m'):'';
    h+='<div class="pc" onclick="panTo('+p.location.lng+','+p.location.lat+')"><div class="pn">'+p.name+'</div><div class="pa">'+(p.address||'')+'</div>';
    if(d)h+='<div class="pd">距离 '+d+'</div>';
    h+='<div class="pab"><button class="b bo bs" onclick="event.stopPropagation();setFrom(\''+esc(p.name)+'\')">设为起点</button><button class="b bo bs" onclick="event.stopPropagation();setTo(\''+esc(p.name)+'\')">设为终点</button></div></div>';
    addPOIMk(p);
  });
  c.innerHTML=h;toast('搜索完成，共 '+total+' 个结果');
}

function addPOIMk(p){
  var mk=new A.Marker({position:[p.location.lng,p.location.lat],title:p.name,offset:new A.Pixel(-13,-30)});
  mk.setContent('<div style="background:var(--pri);color:#fff;padding:2px 8px;border-radius:12px;font-size:12px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)">'+p.name+'</div>');
  var iw=new A.InfoWindow({content:'<div style="padding:8px;max-width:260px"><div style="font-weight:600;margin-bottom:4px">'+p.name+'</div><div style="font-size:12px;color:#666">'+(p.address||'')+'</div>'+(p.tel?'<div style="font-size:12px;color:#666;margin-top:2px">'+p.tel+'</div>':'')+'</div>',offset:new A.Pixel(0,-30)});
  mk.on('click',function(){iw.open(map,mk.getPosition())});
  mk.setMap(map);poiMks.push(mk);
}
function clrPOI(){poiMks.forEach(function(m){m.setMap(null)});poiMks=[]}
function panTo(lng,lat){if(map){map.setCenter([lng,lat]);map.setZoom(16)}}
function setFrom(n){document.getElementById('fromIpt').value=n;switchTab('route');toast('已设为起点')}
function setTo(n){document.getElementById('toIpt').value=n;switchTab('route');toast('已设为终点')}

// ==================== 样式 ====================
function initGrid(){
  var g=document.getElementById('styleGrid'),h='';
  STYLES.forEach(function(s){h+='<div class="si'+(s===curStyle?' on':'')+'" onclick="setStyle(\''+s+'\')">'+SNAME[s]+'</div>'});
  g.innerHTML=h;
}
function setStyle(s){if(!map)return;curStyle=s;map.setMapStyle('amap://styles/'+s);initGrid();toast('已切换: '+SNAME[s])}

// 定位
function locateMe(){if(!ready)return;try{var g=new A.Geolocation({enableHighAccuracy:true,timeout:10000});g.getCurrentPosition(function(s,r){if(s==='complete'){myPos=[r.position.lng,r.position.lat];map.setCenter(myPos);map.setZoom(15);toast('已定位')}else toast('定位失败')})}catch(e){}}

// 分享
function openShare(){if(!map){toast('地图未加载');return}var c=map.getCenter(),z=map.getZoom();document.getElementById('shareTxt').value=location.origin+location.pathname+'?lng='+c.lng.toFixed(6)+'&lat='+c.lat.toFixed(6)+'&zoom='+z+'&style='+curStyle;document.getElementById('shareModal').classList.add('show')}
function closeShare(){document.getElementById('shareModal').classList.remove('show')}
function copyShare(){var t=document.getElementById('shareTxt').value;if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('已复制');closeShare()});else{document.getElementById('shareTxt').select();document.execCommand('copy');toast('已复制');closeShare()}}

// 自动补全
function onAC(type){
  clearTimeout(acTmr);
  var iptid=type==='from'?'fromIpt':type==='to'?'toIpt':'kwIpt';
  var ipt=document.getElementById(iptid);var v=ipt.value.trim();
  ipt.nextElementSibling.style.display=v?'inline':'none';
  if(!v||!A){document.getElementById('acBox').style.display='none';return}
  acTmr=setTimeout(function(){
    try{var ac=new A.AutoComplete({city:'全国'});ac.search(v,function(s,r){
      if(s==='complete'&&r.tips){
        var box=document.getElementById('acBox'),h='';
        r.tips.forEach(function(t){
          if(t.location){var nm=esc(t.name),ds=t.district||'';h+='<div onclick="pickAC(\''+iptid+'\',\''+nm+'\')">'+t.name+'<span style="color:#999;margin-left:4px;font-size:11px">'+ds+'</span></div>'}
        });
        if(h){box.innerHTML=h;var rect=ipt.getBoundingClientRect();box.style.left=rect.left+'px';box.style.top=rect.bottom+'px';box.style.width=rect.width+'px';box.style.display='block'}else{box.style.display='none'}
      }
    })}catch(e){console.error(e)}
  },300);
}
function pickAC(iptid,name){document.getElementById(iptid).value=name;document.getElementById('acBox').style.display='none'}
function clr(type){
  var id=type==='from'?'fromIpt':type==='to'?'toIpt':'kwIpt';
  document.getElementById(id).value='';document.getElementById(id).nextElementSibling.style.display='none';
  document.getElementById('acBox').style.display='none';
}
document.addEventListener('click',function(e){if(!e.target.closest('.iwrap')&&!e.target.closest('.ac'))document.getElementById('acBox').style.display='none'});

// 工具
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},2000)}
function esc(s){return s.replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function restoreURL(){try{var p=new URLSearchParams(location.search),ln=parseFloat(p.get('lng')),la=parseFloat(p.get('lat')),z=parseInt(p.get('zoom')),s=p.get('style');if(ln&&la&&map)map.setCenter([ln,la]);if(z&&map)map.setZoom(z);if(s)setStyle(s)}catch(e){}}
</script>
</body>
